name: Semgrep SAST (seguridad)

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep CI (OWASP Top 10 + CWE Top 25 + secretos)
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_RULES: p/owasp-top-ten p/cwe-top-25 p/secrets p/security-audit

      - name: Subir resultados como artifact (respaldo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.*
          if-no-files-found: ignore
